<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atmospheric Lettuce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="izquierda">
      <img src="logo en blanco.png" alt="Logo de Atmospheric Lettuce" class="logo">
    </div>

    <div class="derecha">
      <form class="form" action="#" method="post" novalidate>
        <div class="titulo">Crear cuenta</div>

        <div class="input-group">
          <div class="input">
            <input type="nombre" name="nombre" placeholder="Nombre" required>
          </div>
        </div>

        <div class="input-group">
          <div class="input">
            <input type="email" name="usuario" placeholder="Correo electrónico" required>
          </div>
        </div>

        <div class="input-group">
          <div class="input">
            <input type="password" name="contrasena" placeholder="Contraseña" required>
          </div>
        </div>

        <div class="input-group">
          <div class="input">
            <input type="password" name="contrasena" placeholder=" Confirmar Contraseña" required>
          </div>
        </div>

        <div class="input-group">
          <button type="submit" class="btn">Registrarme</button>
        </div>
        
        <div class="registro">
            ¿Ya tienes una cuenta?
            <a href="index.html">Iniciar Sesión</a>
        </div>
        

        
      </form>
    </div>
  </div>
</body>
</html>
