<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa con OpenLayers + Nominatim</title>

  <!-- OpenLayers CSS y JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol/dist/ol.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .ol-popup {
      position: absolute;
      background-color: white;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      bottom: 12px;
      left: -50px;
      min-width: 200px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="obtener_ubicacion.js"></script>
</body>
</html>
