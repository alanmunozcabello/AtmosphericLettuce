<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcador de Áreas de Cultivo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol/ol.css" />
  <style>
    #map {
      width: 100%;
      height: 100vh;
    }
    .ol-popup {
      position: absolute;
      background-color: white;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      bottom: 12px;
      left: -50px;
      min-width: 180px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdn.jsdelivr.net/npm/ol/dist/ol.js"></script>
  <script src="js/utilidades/utils.js"></script>
  <script src="js/usuario/nav_correo.js"></script>
  <script src="js/mapa/marcar_superficie.js"></script>
</body>
</html>
