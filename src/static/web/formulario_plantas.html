<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Formulario de plantas</title>

    <style>
        body { overflow: hidden !important; }
        body > *:not(.loading-screen) {
            visibility: hidden !important;
            opacity: 0 !important;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #5db5ff, #55c2a5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }
    </style>

    <link rel="stylesheet" href="css/formulario_plantas.css">
    <link rel="stylesheet" href="css/loading.css">

    <script>
      (function() {
        const token = localStorage.getItem('token')
        if (!token) {
          document.documentElement.style.display = 'none'
          window.location.replace('index.html')
          return
        }
        try {
          const payload = JSON.parse(atob(token.split('.')[1]))
          if (payload.exp < Math.floor(Date.now() / 1000)) {
            localStorage.clear()
            document.documentElement.style.display = 'none'
            window.location.replace('index.html')
          }
        } catch (e) {
          localStorage.clear()
          document.documentElement.style.display = 'none'
          window.location.replace('index.html')
        }
      })()
    </script>
</head>

<body>
    <!-- ========== LOADING SCREEN ========== -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-spinner">
        <div class="spinner-leaf"></div>
        <div class="spinner-leaf"></div>
        <div class="spinner-leaf"></div>
        </div>
    </div>
    <form id="formulario-plantas">
        <div class="contenedor_general">
            <div class="contenedor_superior">
                <div class="logo">
                    <img src="img/logo.png" alt="Logo de la empresa">
                </div>
                <div class="acciones-formulario">
                    <button type="button" class="btn-regresar" id="btnRegresar">← Regresar</button>
                    <button type="submit" class="enviar">Enviar</button>
                </div>
            </div>
            <div class="contenedor-progreso">
                <div class="barra-progreso" id="barraProgreso"></div>
                <span class="texto-progreso" id="textoProgreso">0%</span>
            </div>
            <div class="formulario">
                <div class="fijos">
                    <div class="info-cultivo" id="infoCultivo" style="display: none;">
                        <h2 style="margin-left: 10px; color: #2c3e50;">Datos tecnicos del cultivo: <span
                                id="nombreCultivo" class="nombre-cultivo"></span></h2>
                    </div>
                    <h2 id="tituloGeneral" style="margin-left: 10px;">Información del cultivo</h2>

                    <label style="margin-left: 10px;" for="etapa">Etapa de la planta:</label>
                    <select style="margin-left: 10px;" id="etapa" name="etapa" required>
                        <option value="">Selecciona una etapa</option>
                        <option value="siembra-germinacion">Siembra/Germinación</option>
                        <option value="crecimiento-vegetativo">Crecimiento vegetativo</option>
                        <option value="floracion">Floración</option>
                        <option value="fructificacion">Fructificación/Llenado de grano</option>
                        <option value="maduracion">Maduración</option>
                        <option value="cosecha-dormancia">Cosecha/Dormancia</option>
                    </select>
                    <label style="margin-left: 10px; margin-top: 10px;" for="tipo_riego">Tipo de riego:</label>
                    <div class="opciones-riego">
                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="goteo" required>
                            <span class="checkmark"></span>
                            Goteo
                        </label>

                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="aspersion">
                            <span class="checkmark"></span>
                            Aspersión
                        </label>

                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="inundacion">
                            <span class="checkmark"></span>
                            Inundación
                        </label>

                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="pivote-central">
                            <span class="checkmark"></span>
                            Pivote central
                        </label>

                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="microaspersion">
                            <span class="checkmark"></span>
                            Microaspersión
                        </label>

                        <label class="opcion-riego">
                            <input type="radio" name="tipo_riego" value="otro" id="otro_riego_radio">
                            <span class="checkmark"></span>
                            Otro
                        </label>
                    </div>

                    <!-- Campo para "Otro" -->
                    <input type="text" id="otro_riego" name="otro_riego" placeholder="Especificar otro tipo de riego"
                        style="display: none; width: 80%; margin-left: 30px; margin-top: 5px;">
                    <label style="margin-left: 10px;" for="ultimo_riego">Último riego:</label>
                    <input style="margin-left: 10px;" type="datetime-local" id="ultimo_riego" name="ultimo_riego"
                        required>

                    <label style="margin-left: 10px; margin-top:10px;" for="frecuencia">Frecuencia Actual de
                        Riego:</label>
                    <select style="margin-left: 10px; margin-bottom:10px;" id="frecuencia" name="frecuencia" required>
                        <option value="">Selecciona días</option>
                        <option value="1">Cada 1 día</option>
                        <option value="2">Cada 2 días</option>
                        <option value="3">Cada 3 días</option>
                        <option value="4">Cada 4 días</option>
                        <option value="5">Cada 5 días</option>
                    </select>

                    <label style="margin-left: 10px;" for="humedad_suelo">Humedad del Suelo (%):</label>
                    <select style="margin-bottom: 10px; margin-left: 10px;" id="humedad_suelo" name="humedad_suelo"
                        required>
                        <option value="">Selecciona porcentaje</option>
                        <option value="10">10%</option>
                        <option value="15">15%</option>
                        <option value="20">20%</option>
                        <option value="25">25%</option>
                        <option value="30">30%</option>
                    </select>
                    <br>
                    <!--mensaje para incentivar al usuario a llenar todo lo demas-->
                    <p style="margin-left: 10px;">Por favor, completa todos los campos para obtener mejores
                        recomendaciones.</p>

                    <button type="button" class="datos_adicionales" id="btnDatosAdicionales">
                        Datos adicionales
                    </button>

                    <!-- Campos adicionales (ocultos inicialmente) -->
                    <div class="campos-adicionales" id="camposAdicionales" style="display: none;">
                        <h2 style="margin-left: 10px; margin-top: 20px; margin-bottom: 15px;">Datos de las plantas</h2>

                        <label style="margin-left: 10px;" for="textura">Textura del suelo:</label>
                        <select style="margin-left: 10px; margin-bottom:10px;" id="textura" name="textura">
                            <option value="">Selecciona textura</option>
                            <option value="arenoso">Arenoso</option>
                            <option value="franco">Franco</option>
                            <option value="arcilloso">Arcilloso</option>
                            <option value="franco-arenoso">Franco arenoso</option>
                            <option value="franco-arcilloso">Franco arcilloso</option>
                            <option value="arcillo-arenoso">Arcillo arenoso</option>
                        </select>

                        <label style="margin-left: 10px;" for="variedad">Variedad de la planta:</label>
                        <input type="text" id="variedad" name="variedad" placeholder="Ingresa la variedad">

                        <label style="margin-left: 10px;" for="estado_planta">Estado de la Planta:</label>
                        <input type="text" id="estado_planta" name="estado_planta"
                            placeholder="(Observación Visual) ¿Cómo se ve la planta?">

                        <label style="margin-left: 10px;" for="estres_hidrico">Estrés Hídrico:</label>
                        <select style="margin-left: 10px; margin-bottom:10px;" id="estres_hidrico"
                            name="estres_hidrico">
                            <option value="">Selecciona una opción</option>
                            <option value="si">Sí - Ve señales de falta de agua</option>
                            <option value="no">No - La planta se ve saludable</option>
                        </select>

                        <label style="margin-left: 10px;" for="profundidad_radical">Profundidad radical (cm):</label>
                        <input style="margin-left: 10px; margin-bottom:10px;" type="number" id="profundidad_radical"
                            name="profundidad_radical" placeholder="Profundidad en cm" min="1" step="1">

                        <label style="margin-left: 10px;" for="densidad_plantacion">Densidad de la plantación
                            (plantas/ha):</label>
                        <input style="margin-left: 10px;" type="number" id="densidad_plantacion"
                            name="densidad_plantacion" placeholder="Número de plantas por hectárea" min="1" step="1">

                        <h2 style="margin-left: 10px; margin-top: 20px; margin-bottom: 15px;">Datos del riego</h2>

                        <label style="margin-left: 10px;" for="sensor_humedad">Tipo de Sensor:</label>
                        <select style="margin-left: 10px; margin-bottom:10px;" id="sensor_humedad"
                            name="sensor_humedad">
                            <option value="">Selecciona tipo de sensor</option>
                            <option value="capacitancia">Capacitancia</option>
                            <option value="tensiometro">Tensiómetro</option>
                            <option value="resistencia">Resistencia eléctrica</option>
                            <option value="neutrones">Neutrones</option>
                            <option value="tdr">TDR (Time Domain Reflectometry)</option>
                            <option value="gravimetrico">Gravimétrico</option>
                            <option value="no-tiene">No tiene sensor</option>
                        </select>

                        <label style="margin-left: 10px; " for="eficiencia">Eficiencia del riego (%):</label>
                        <input style="margin-left: 10px; margin-bottom:10px;" type="number" id="eficiencia"
                            name="eficiencia" placeholder="Ingresa la eficiencia sin el %" min="0" max="100" step="0.1">

                        <label style="margin-left: 10px;margin-bottom:10px;" for="caudal">Caudal (L/h):</label>
                        <input style="margin-left: 10px; margin-bottom:10px;" type="number" id="caudal" name="caudal"
                            placeholder="Litros por hora" min="0" step="0.1">

                        <label style="margin-left: 10px;" for="ph_agua">pH del agua:</label>
                        <input style="margin-left: 10px; margin-bottom:10px;" type="number" id="ph_agua" name="ph_agua"
                            placeholder="Ingresa el pH del agua" min="0" max="14" step="0.1">

                        <label style="margin-left: 10px;" for="acolchado">Acolchado:</label>
                        <select style="margin-left: 10px; margin-bottom:10px;" id="acolchado" name="acolchado">
                            <option value="">Selecciona una opción</option>
                            <option value="si">Sí - Hay acolchado en la base</option>
                            <option value="no">No - No hay acolchado</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <script src="js/utilidades/autenticacion.js" defer></script>
    <script src="js/utilidades/proteger_pagina.js" defer></script>
    <script src="js/utilidades/utils.js" defer></script>
    <script src="js/cultivos/formulario_plantas.js"></script>
    <script src="js/core/loading.js"></script>
</body>

</html>
