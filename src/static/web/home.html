<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atmospheric Lettuce</title>
  <link rel="stylesheet" href="css/homes.css">
  <link rel="stylesheet" href="css/chat_bot.css">
</head>
<body>
  <!-- Barra superior -->
  <div class="barra-superior">
    <div class="logo">
      <img src="img/logo.png" alt="Logo de la empresa">
    </div>
    <div class="buscador">
      <input type="text" placeholder="Introducir ubicación">  
    </div>
    <div class="acciones">
      <div class="icono">🔔</div>
     <a id="btn-usuario" class="icono" href="perfil.html" aria-label="Perfil">👤</a>
      </a>
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="contenido">
    <!-- Clima -->
  
   <div class="tarjeta clima-card" onclick="location.href='dias.html'">
    <div class="dia">Hoy</div>
    <div class="temperatura">22°C</div>
    <div class="minmax">
      <span class="max">Máx: 26°C</span>
      <span class="min">Mín: 15°C</span>
    </div>
    <div class="descripcion">Soleado</div>
    <div class="icono-clima">☀️</div>
  </div>

    <!-- Detalles -->
    <div class="tarjeta detalles">
      <div class="titulo">Detalles</div>
      <div class="info-detalles">💧 Humedad <span class="detail">65%</span></div>
      <div class="info-detalles">🌬️ Viento <span class="detail">15 km/h</span></div>
      <div class="info-detalles">🌡️ Sensación Térmica <span class="detail">24°C</span></div>
    </div>

    <!-- Cultivos -->
<div class="tarjeta cultivos">
  <div class="titulo">Cultivos</div>

  <form id="form-cultivo" class="form-cultivo" autocomplete="off">
    <input id="input-cultivo" type="text" placeholder="Añadir cultivo (p. ej., Zanahoria)">
    <button type="submit">Agregar</button>
  </form>

  <ul id="lista-cultivos" class="lista-cultivos"></ul>
</div>

    <!-- Consejos -->
    <div class="tarjeta consejos">
      <div class="titulo">Consejos</div>
      <div class="info-detalles">✔ Clima perfecto para regar las plantas</div>
    </div>
  </div>

  <!-- Botón flotante -->
   <!-- Botón flotante -->
  <div class="chatbot" id="chatToggle">🥬</div>
  
  <!-- Ventana del chat flotante -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <span>Chat Agro</span>
      <button id="closeChat" style=></button>
    </div>

    <div class="chat-body" id="chatBox"></div>
    
    <!-- Aqí se añaden los archivos seleccionados (feedback para el usuario) -->
    <div id="fileFeedback" style="display:flex; flex-wrap:wrap; gap:4px; padding:4px;"></div>

    <div class="chat-input">
      <input type="text" id="textoInput" placeholder="Escribe un mensaje...">

      <!-- Botones de acción -->
      <button id="fileBtn">📄</button>
      <button id="enviarBtn">Enviar</button>

      <!-- Inputs de archivo ocultos -->
      <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none"> <!--ahora se pueden subir multiples archivos con los formatos permitidos-->
    </div>
  </div>

  <script src="js/nav_correo.js" defer></script>
  <script src="js/cultivos.js" defer></script>
  <script src="js/chat_controller.js" defer></script>

</body>
</html>
