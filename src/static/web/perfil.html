<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Atmospheric Lettuce</title>
  <link rel="stylesheet" href="css/perfil.css" />
</head>

<body>
  <!-- Barra superior -->
  <div class="barra-superior">
    <div class="logo">
      <a href="home.html">
        <img src="img/logo.png" alt="Logo de la empresa" />
      </a>
    </div>
    <div class="buscador">
      <input type="text" placeholder="Introducir ubicación" />
    </div>
    <div class="acciones">
      <div class="icono">🔔</div>
      <div class="icono">👤</div>
      <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
    </div>
  </div>

  <div class="contenedor">
    <!-- Columna izquierda -->
    <div class="columna-izquierda">
      <div class="avatar-fondo">
        <img alt="Avatar" />
      </div>
      <div class="rol">Agricultor</div>
    </div>

    <!-- Columna derecha -->
    <div class="columna-derecha">
      <div class="nombre"></div>
      <div class="desde">Usuario desde marzo de 2020</div>

      <div class="tarjeta-perfil">
        <!-- Boton de acción dentro de la tarjeta -->
        <div class="titulo" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Perfil</span>
          <div class="acciones-perfil">
            <button id="btn-editar" class="btn">Editar</button>
            <button id="btn-guardar" class="btn btn-primary" style="display:none;">Guardar</button>
            <button id="btn-cancelar" class="btn" style="display:none;">Cancelar</button>
          </div>
        </div>

        <div class="fila">
          <div class="etiqueta">Correo electrónico</div>
          <div class="valor" id="valor-correo"></div>
        </div>

        <div class="fila">
          <div class="etiqueta">Ubicación</div>
          <div class="valor" id="valor-cuidad"></div>
        </div>

        <div class="fila">
          <div class="etiqueta">Region</div>
          <div class="valor" id="valor-region"></div>
        </div>
      </div>
     


      <!--Formulario oculto de edición -->
      <form id="form-perfil" class="form-perfil" style="display:none;" autocomplete="off">
        <div class="grupo">
          <label>Nombre</label>
          <input id="inp-nombre" type="text" placeholder="Nombre" required />
          <span class="error-msg">⚠️ El nombre es obligatorio</span>
        </div>
        <div class="grupo">
          <label>Correo electrónico</label>
          <input id="inp-correo" type="email" placeholder="correo@ejemplo.com" required />
          <span class="error-msg">⚠️ El correo es obligatorio</span>
        </div>
        <div class="grupo">
          <label>Ubicación</label>
          <input id="inp-ubicacion" type="text" placeholder="Ciudad" />
        </div>
        <div class="grupo">
          <!-- Cambio de idioma a region -->
          <label>Region</label>
          <input id="inp-region" type="text" placeholder="Region" />
        </div>

        <!-- Opcional: subir avatar -->
        <div class="grupo">
          <label>Avatar</label>
          <input id="inp-avatar" type="file" accept="image/*" />
        </div>
      </form>
    </div>
  </div>


   <div class="contenedor-delete">
        <button id="btn-delete" class="btn-delete">Borrar cuenta</button>
      </div>

      <!-- Alerta de confirmación -->
      <div id="alerta-borrar" class="alerta-borrar">
        <div class="alerta-contenido">
          <h2>⚠️ ¿Estás seguro?</h2>
          <p>Esta acción eliminará tu cuenta permanentemente.</p>
          <div class="alerta-acciones">
            <button id="btn-cancelar-borrar" class="btn-cancelar">Cancelar</button>
            <button id="btn-confirmar-borrar" class="btn-confirmar">Sí, borrar</button>
          </div>
        </div>
      </div>

  <!-- Conecta el JavaScript -->

  <script src="js/utilidades/utils.js" defer></script>
  <script src="js/usuario/nav_correo.js" defer></script>
  <script src="js/usuario/perfil.js" defer></script>
  <script src="js/usuario/borrar_cuenta.js" defer></script>


</body>

</html>
