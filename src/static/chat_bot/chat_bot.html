<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Chat Agro - Demo</title>
  <link rel="stylesheet" href="chat_bot.css">
</head>
<body>
  <h1>Chat Agro (demo)</h1>
  <!-- Botón flotante -->
  <div class="chatbot" id="chatToggle">🥬</div>
  
  <!-- Ventana del chat flotante -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <span>Chat Agro</span>
      <button id="closeChat" style=></button>
    </div>

    <div class="chat-body" id="chatBox"></div>

    <div class="chat-input">
      <input type="text" id="textoInput" placeholder="Escribe un mensaje...">

      <!-- Botones de acción -->
      <button id="fileBtn">📄</button>
      <button id="enviarBtn">Enviar</button>

      <!-- Inputs de archivo ocultos -->
      <input type="file" id="fileInput" accept="image/*,application/pdf" multiple style="display:none"> <!--ahora se pueden subir multiples archivos con los formatos permitidos-->
    </div>
  </div>

<script src="chat_controller.js"></script><!--aquí se llama al controlador-->
  
  </div>
</body>
</html>
