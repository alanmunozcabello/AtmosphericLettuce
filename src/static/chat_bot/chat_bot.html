<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Chat Agro - Demo</title>
</head>
<body>
  <h1>Chat Agro (demo)</h1>

<!--Esto es todo lo que necesitamos para que funcione en si el sistema de preguntas y respuestas-->
  <input type="text" id="textoInput" placeholder="Escribe un mensaje...">
  <input type="file" id="fileInput" accept="image/*,application/pdf" multiple> <!--ahora se pueden subir multiples archivos con los formatos permitidos-->
  <button id="enviarBtn">Enviar</button>

  <script src="chat_controller.js"></script><!--aquí se llama al controlador-->
<!--hasta aquí es lo necesario ^^-->
  <pre id="respuesta"></pre> <!--casilla que muestra el mensaje de ida-->

  <div id="chatBox"></div> <!--casilla que muestra la respuesta-->

</body>
</html>
