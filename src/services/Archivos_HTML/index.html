<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Reporte Agrícola</title>
  <style>
    /* Reset básico para emails */
    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    img {
      border: 0;
      outline: none;
      text-decoration: none;
      -ms-interpolation-mode: bicubic;
    }
    table {
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
  
  <!-- Contenedor principal con ancho fijo para emails -->
  <table width="100%" border="0" cellspacing="0" cellpadding="0" bgcolor="#f4f4f4">
    <tr>
      <td align="center" style="padding: 20px 0;">
        
        <!-- Tabla de contenido de 600px (estándar para emails) -->
        <table width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #ffffff; border-radius: 8px;">
          
          <!-- ENCABEZADO -->
          <tr>
            <td align="center" style="padding: 30px 20px; background: linear-gradient(135deg, #5db5ff, #55c2a5); border-radius: 8px 8px 0 0;">
              <h1 style="margin: 0; color: #ffffff; font-size: 28px;">
                Reporte Semanal de Cultivos
              </h1>
            </td>
          </tr>

          <!-- INFORMACIÓN DEL USUARIO -->
          <tr>
            <td style="padding: 20px; border-bottom: 2px solid #f0f0f0;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td>
                    <p style="margin: 0 0 5px 0; color: #333333; font-size: 16px; font-weight: bold;">
                      {{ usuario.nombre }}
                    </p>
                    <p style="margin: 0; color: #666666; font-size: 14px;">
                      {{ usuario_correo }}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CONSEJOS POR CULTIVO -->
          {% for item in consejos %}
          <tr>
            <td style="padding: 20px;">
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="padding: 15px; background-color: #f9f9f9; border-left: 4px solid #5db5ff; border-radius: 5px;">
                    <h2 style="margin: 0 0 10px 0; color: #5db5ff; font-size: 20px;">
                      🌱 {{ item.cultivo }}
                    </h2>
                    <p style="margin: 0; color: #666666; font-size: 14px; line-height: 1.6;">
                      {{ item.consejo }}
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          {% endfor %}

          <!-- PIE DE PÁGINA -->
          <tr>
            <td align="center" style="padding: 20px; background-color: #f0f0f0; border-radius: 0 0 8px 8px;">
              <p style="margin: 0; color: #999999; font-size: 12px;">
                © 2025 AtmosphericLettuce - Sistema de Monitoreo Agrícola
              </p>
            </td>
          </tr>

        </table>
        
      </td>
    </tr>
  </table>

</body>
</html>
